# /home/user/ar0xOS/archiso/syslinux/syslinux.cfg
# -----------------------------------------------------------------------------
# PHASE 4 created the menu; PHASE 7 replaced splash.png with the official
# SVG-derived ar0x logomark (archiso 92 `bios.syslinux` mode).
#
# archiso 92 requires `syslinux` in packages.x86_64 and >= 1 *.cfg here. It
# substitutes %ARCHISO_LABEL% %ARCHISO_UUID% %INSTALL_DIR% %KERNEL_PARAMS%
# %ARCH%. It also copies <profile>/syslinux/splash.png -> /boot/syslinux/ on
# the ISO (mkarchiso::_make_bootmode_bios.syslinux).
#
# `UI vesamenu.c32` (not menu.c32) is required for MENU BACKGROUND. vesamenu.c32
# is shipped by the `syslinux` package inside the airootfs and copied by
# mkarchiso from /usr/lib/syslinux/bios/*.c32.
#
# ⚠️ MENU COLOR uses #RRGGBB (vesamenu, 640x480+ VESA). The plain text
#    menu.c32 would ignore MENU BACKGROUND. Do not downgrade to menu.c32.
# -----------------------------------------------------------------------------

DEFAULT ar0x
PROMPT 0
TIMEOUT 50
UI vesamenu.c32

MENU TITLE ar0x 0.1.0  //  AR0X ROOT
MENU BACKGROUND splash.png
MENU CLEAR

# element        ansi       foreground  background  shadow
# syslinux syntax: foreground=#RRGGBB, background=#AARRGGBB (AA = alpha).
# Transparent backgrounds let splash.png show through; only the selected row
# gets an opaque cyan fill.
MENU COLOR screen       0          #ffffffff #00000000 none
MENU COLOR border       30;44      #00e5ff   #00000000 std
MENU COLOR title        1;36;44    #00e5ff   #00000000 std
MENU COLOR sel          7;37;40    #07090f   #ff00e5ff all
MENU COLOR hotsel       1;7;37;40  #07090f   #ffa8ff60 all
MENU COLOR unsel        37;44      #d7e0ee   #00000000 std
MENU COLOR help         37;40      #6b7891   #00000000 std
MENU COLOR timeout_msg  37;40      #ff2e88   #00000000 std
MENU COLOR timeout      1;37;40    #00e5ff   #00000000 std
MENU COLOR tabmsg       37;40      #6b7891   #00000000 std

MENU WIDTH 76
MENU MARGIN 8
MENU ROWS 8
MENU TABMSGROW 20
MENU CMDLINEROW 21
MENU ENDROW 23
MENU HELPMSGROW 22

LABEL ar0x
    MENU LABEL ^Boot ar0x 0.1.0  (x86_64, BIOS)
    MENU DEFAULT
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL ar0x-failsafe
    MENU LABEL Boot ar0x  ^FAILSAFE  (nomodeset, verbose, no splash)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset plymouth.enable=0 apparmor=1 security=apparmor loglevel=7 systemd.show_status=true

LABEL ar0x-text
    MENU LABEL Boot ar0x to  ^TEXT CONSOLE  (multi-user.target)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% systemd.unit=multi-user.target plymouth.enable=0 apparmor=1 security=apparmor

LABEL local
    MENU LABEL Boot from ^local disk
    LOCALBOOT 0

LABEL reboot
    MENU LABEL ^Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL ^Power off
    COM32 poweroff.c32
