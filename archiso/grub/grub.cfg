# /home/user/ar0xOS/archiso/grub/grub.cfg
# -----------------------------------------------------------------------------
# PHASE 4 — ar0x-branded UEFI GRUB menu (archiso 92 `uefi.grub` bootmode).
#
# archiso 92 substitutes: %ARCHISO_LABEL% %INSTALL_DIR% %ARCH%
#   %ARCHISO_UUID% %KERNEL_PARAMS% %ARCHISO_SEARCH_FILENAME%.
# The rendered file lands at /boot/grub/grub.cfg on the ISO; the embedded
# EFI binary chain-loads it via `configfile (${ARCHISO_HINT})/boot/grub/grub.cfg`.
# Theme assets come from <profile>/grub/themes/ar0x/ -> /boot/grub/themes/ar0x/
# (mkarchiso copies every non-*.cfg file out of <profile>/grub/).
#
# ⚠️ archiso's grub-mkstandalone uses --themes="" and embeds NO font. This
#    theme deliberately uses no *-font keys so GRUB's built-in font is used.
#    Phase 7 can add ar0x.pf2 + a `loadfont` line here.
# -----------------------------------------------------------------------------

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod udf
insmod png
insmod all_video
insmod gfxmenu
insmod gfxterm
insmod font

# Load a theme font if Phase 7 supplies one; otherwise the built-in font is used.
if [ -f /boot/grub/themes/ar0x/ar0x-16.pf2 ]; then
    loadfont /boot/grub/themes/ar0x/ar0x-16.pf2
fi

set gfxmode="auto"
terminal_input console
terminal_output gfxterm

# GRUB's $root is set to the ISO volume by archiso's embedded config.
if [ -f /boot/grub/themes/ar0x/theme.txt ]; then
    set theme=/boot/grub/themes/ar0x/theme.txt
    export theme
fi

insmod serial
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

set default="ar0x"
set timeout=15
set timeout_style=menu

menuentry "ar0x 0.1.0  //  NEON ROOT" --class ar0x --class gnu-linux --class gnu --class os --id 'ar0x' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts \
        archisobasedir=%INSTALL_DIR% \
        archisosearchuuid=%ARCHISO_UUID% \
        %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
}

menuentry "ar0x  //  FAILSAFE (nomodeset, verbose, no splash)" --class ar0x --class gnu-linux --class gnu --class os --id 'ar0x-failsafe' {
    set gfxpayload=text
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts \
        archisobasedir=%INSTALL_DIR% \
        archisosearchuuid=%ARCHISO_UUID% \
        nomodeset plymouth.enable=0 apparmor=1 security=apparmor loglevel=7 systemd.show_status=true
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
}

menuentry "ar0x  //  BOOT TO TEXT CONSOLE" --class ar0x --class gnu-linux --class gnu --class os --id 'ar0x-text' {
    set gfxpayload=text
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts \
        archisobasedir=%INSTALL_DIR% \
        archisosearchuuid=%ARCHISO_UUID% \
        systemd.unit=multi-user.target plymouth.enable=0 apparmor=1 security=apparmor
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
}

if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'UEFI Firmware Settings' --class efi --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --id 'shutdown' {
    echo 'Shutting down...'
    halt
}

menuentry 'System restart' --class reboot --id 'reboot' {
    echo 'Rebooting...'
    reboot
}
