# /etc/systemd/journald.conf.d/10-ar0x.conf — journald for a developer box.
[Journal]
Storage=persistent
Compress=yes
# 512 MiB is generous for debugging but bounded so /var cannot fill a 40 GiB
# build or a small SSD. Rotate at 64 MiB per file, keep one month.
SystemMaxUse=512M
SystemMaxFileSize=64M
MaxRetentionSec=1month
# journalctl is the single log surface; do not duplicate to syslog.
ForwardToSyslog=no
# Keep kernel ring buffer messages (GPU/WiFi debugging in Phase 11).
ReadKMsg=yes
