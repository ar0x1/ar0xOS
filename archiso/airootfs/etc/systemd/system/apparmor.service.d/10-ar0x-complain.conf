# /etc/systemd/system/apparmor.service.d/10-ar0x-complain.conf
# ADR-009 / RISK-008: AppArmor v0.1 runs in COMPLAIN mode (log, do not block).
# Enforcing profiles break xdg-desktop-portal, PipeWire and GPU drivers before
# the profiles have been tuned. Graduation to enforce is a v0.2 ADR.
# `-` prefix = non-fatal if the tooling or profiles are absent.
[Service]
ExecStartPost=-/usr/bin/sh -c 'aa-complain /etc/apparmor.d/* 2>/dev/null || apparmor_parser -C -r /etc/apparmor.d/* 2>/dev/null || true'
