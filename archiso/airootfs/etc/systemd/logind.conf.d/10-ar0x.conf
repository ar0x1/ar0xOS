# /etc/systemd/logind.conf.d/10-ar0x.conf
# Hyprland (Phase 6) binds its own power keys; logind is the fallback for
# non-session contexts. IdleAction=ignore prevents a Wayland session from
# being suspended out from under a long compile.
[Login]
HandlePowerKey=poweroff
HandleRebootKey=reboot
HandleSuspendKey=suspend
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
IdleAction=ignore
