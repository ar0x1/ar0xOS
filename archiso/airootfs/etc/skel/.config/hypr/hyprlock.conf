# /etc/skel/.config/hypr/hyprlock.conf
# hyprlock 0.9.7. Colour syntax per upstream assets/example.conf:
#   rgba(RRGGBBAA)  |  rgb(r, g, b)  |  rgba(r, g, b, a)
# ⚠️ hyprlock EXITS WITH AN ERROR if no config is found — this file is required.
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    text_trim = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /usr/share/backgrounds/ar0x/ar0x-circuit.png
    blur_passes = 2
    blur_size = 5
    noise = 0.0117
    contrast = 1.1
    brightness = 0.75
    vibrancy = 0.18
    vibrancy_darkness = 0.0
}

# Clock — cyan, top-centre
label {
    monitor =
    text = $TIME
    color = rgba(00e5ffee)
    font_size = 88
    font_family = $font
    position = 0, 180
    halign = center
    valign = top
}

# Date — muted, below the clock
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(d7e0eeff)
    font_size = 22
    font_family = $font
    position = 0, 100
    halign = center
    valign = top
}

input-field {
    monitor =
    size = 320, 60
    outline_thickness = 3
    rounding = 6
    inner_color = rgba(11151fff)
    outer_color = rgba(00e5ffee) rgba(ff2e88ee) 45deg
    check_color = rgba(a8ff60ee)
    fail_color = rgba(ff5c57ee)
    font_color = rgba(d7e0eeff)
    font_family = $font
    fade_on_empty = false
    placeholder_text = <i>ar0x // authenticate</i>
    fail_text = $PAMFAIL$FPRINTFAIL
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    position = 0, -20
    halign = center
    valign = center
}
