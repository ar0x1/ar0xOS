# /etc/skel/.config/gtk-3.0/settings.ini
# GTK3 reads this file directly. GTK4 does NOT honour gtk-theme-name here.
# Tradeoff: Adwaita-dark (shipped by gtk3) is the BASE; ar0x colours come from
# gtk.css in this directory. A fully standalone ar0x GTK3 theme ships in the
# ar0x-theme package (Phase 8). This keeps v0.1 dependable on every GPU.
[Settings]
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Inter 10
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=true
gtk-enable-primary-paste=false
gtk-recent-files-max-age=30
gtk-toolbar-style=3
