# /etc/skel/.config/kitty/kitty.conf
# kitty is the ar0x terminal. Its own theme file is the only reliable way to
# get a true cyberpunk terminal (GTK/Qt theming does not reach kitty).
font_family      JetBrainsMono Nerd Font
font_size        11.0
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
disable_ligatures never

# Palette (config/versions.env, ADR-015)
foreground       #D7E0EE
background       #07090F
selection_background #00E5FF
selection_foreground #07090F
cursor           #00E5FF
cursor_text_color #07090F

color0  #11151F
color1  #FF5C57
color2  #A8FF60
color3  #FF2E88
color4  #00E5FF
color5  #FF2E88
color6  #00E5FF
color7  #D7E0EE
color8  #6B7891
color9  #FF5C57
color10 #A8FF60
color11 #FF2E88
color12 #00E5FF
color13 #FF2E88
color14 #00E5FF
color15 #D7E0EE

background_opacity 0.94
dynamic_background_opacity yes
window_padding_width 8
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
scrollback_lines 10000
shell zsh
