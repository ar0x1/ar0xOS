# /etc/skel/.config/xdg-desktop-portal/hyprland-portals.conf
# XDPH does NOT implement a file picker; it falls back to GTK by default.
# Explicitly declare the order so screenshots/screen sharing use Hyprland
# while file dialogs use the GTK portal (xdg-desktop-portal-gtk).
[preferred]
default = hyprland;gtk
org.freedesktop.impl.portal.FileChooser = gtk
