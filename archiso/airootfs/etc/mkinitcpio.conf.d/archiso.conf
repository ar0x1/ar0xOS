# /etc/mkinitcpio.conf.d/archiso.conf   (target path inside the live system)
# -----------------------------------------------------------------------------
# PHASE 3 — archiso live-initramfs hook drop-in.
#
# Source: archiso 92 configs/releng/airootfs/etc/mkinitcpio.conf.d/archiso.conf
# (verbatim HOOKS/COMPRESSION — do not "simplify" this without re-testing).
# The `microcode` hook merges intel-ucode/amd-ucode into the initramfs, so the
# BIOS/UEFI configs only need a single INITRD line.
#
# mkinitcpio merges /etc/mkinitcpio.conf with every *.conf in the .d directory;
# the HOOKS array below overrides the stock mkinitcpio.conf entirely. archiso
# sets HookDir to <airootfs>/etc/pacman.d/hooks/ so pacman regenerates the
# initramfs automatically after installing linux-lts.
#
# ⚠️ Phase 4 added `plymouth` after `udev microcode` (the hook needs /dev and
# must run before any passphrase prompt) and switched COMPRESSION to zstd.
# `CONFIG_RD_ZSTD=y` is present in the frozen linux-lts 6.18.59-1 config.
# -----------------------------------------------------------------------------
HOOKS=(base udev microcode plymouth modconf memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T0 -19)
