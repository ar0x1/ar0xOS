# /etc/plymouth/plymouthd.conf   (target path inside the live AND installed system)
# -----------------------------------------------------------------------------
# PHASE 4 — Plymouth daemon defaults.
# `plymouth-set-default-theme -R ar0x` writes the same Theme= line and rebuilds
# the initramfs; this file is committed so the setting survives ISO assembly
# even if the tool is not invoked in the chroot.
# -----------------------------------------------------------------------------
[Daemon]
Theme=ar0x
ShowDelay=0
DeviceTimeout=5
