# /etc/pipewire/wireplumber.conf.d/10-ar0x.conf — WirePlumber >= 0.5
# -------------------------------------------------------------------------
# ⚠️ PHASE 5 CORRECTION: WirePlumber 0.5+ reads its fragments from the
#    PIPEWHIRE config directory: /etc/pipewire/wireplumber.conf.d/*.conf.
#    The old 0.4 path /etc/wireplumber/wireplumber.conf.d/ is LEGACY and is
#    silently ignored on our frozen 2026/11/01 snapshot. The Phase 1 skeleton
#    directory config/system/wireplumber/ is retained but intentionally empty.
#
# Unknown keys are ignored by WirePlumber, so a version bump cannot brick audio.
# Runtime tuning should use `wpctl settings --save ...` rather than editing here.
# -------------------------------------------------------------------------
monitor.bluez.properties = {
    bluez5.enable-msbc  = true
    bluez5.enable-sbc-xq = true
}
