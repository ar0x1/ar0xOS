# /etc/pipewire/pipewire.conf.d/10-ar0x.conf — PipeWire 1.6.x SPA-JSON fragment.
# Config fragments are MERGED over /usr/share/pipewire/pipewire.conf; never copy
# the whole upstream config here (it would rot on every PipeWire upgrade).
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 96000 192000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 32
    default.clock.max-quantum   = 2048
    # Keep the resampler high quality; developers often play 44.1k content.
    resample.quality            = 4
}
