# /etc/sddm.conf.d/10-ar0x.conf
# SDDM 0.21.0-7 (Qt6 greeter). Local drop-ins in /etc/sddm.conf.d/ override
# /usr/lib/sddm/sddm.conf.d/*.conf — never edit the packaged file.
#
# ⚠️ Arch's sddm package hard-depends on xorg-server, so the GREETER runs on
#    X11 even though the USER SESSION is Wayland/Hyprland. DisplayServer=wayland
#    is still experimental and needs a compositor command; do NOT enable it on
#    a live ISO. This is a deliberate, documented tradeoff.
[General]
Numlock=none
# SDDM 0.21 enables a Qt on-screen keyboard by default; it draws over the
# login form on laptops and is useless on a developer desktop. Disable it.
InputMethod=
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot

[Theme]
Current=ar0x
ThemeDir=/usr/share/sddm/themes

[Users]
MinimumUid=1000
MaximumUid=60000
DefaultPath=/usr/local/bin:/usr/bin:/bin
