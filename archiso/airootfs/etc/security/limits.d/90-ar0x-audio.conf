# /etc/security/limits.d/90-ar0x-audio.conf — low-latency audio opt-in.
# PipeWire on Arch uses rtkit for realtime scheduling by DEFAULT, so these
# limits are only needed for JACK-style low-latency work. Membership in the
# `audio` group is granted via config/system/sysusers.d/ar0x-live.conf.
@audio   -  rtprio      95
@audio   -  memlock     unlimited
@audio   -  nice       -19
