# /etc/mkinitcpio.conf   (target path inside the live AND installed system)
# -----------------------------------------------------------------------------
# PHASE 4 — ar0x initramfs configuration.
#
# ⚠️ The LIVE ISO does not use this HOOKS line verbatim. archiso 92 merges
#    /etc/mkinitcpio.conf.d/*.conf, and
#    archiso/airootfs/etc/mkinitcpio.conf.d/archiso.conf overrides HOOKS with
#    the archiso live hooks (archiso, archiso_loop_mnt, pxe_*). This file is the
#    base for the INSTALLED system created by Calamares (Phase 10).
#
# Hook order (verified against Arch's mkinitcpio + plymouth package):
#   base udev microcode plymouth ... kms ... block ... filesystems fsck
#   `plymouth` MUST come after `udev` and before `encrypt`/`fsck` so the splash
#   is up before any passphrase prompt. `kms` loads DRM modules early for
#   simpledrm / Plymouth (see CONFIG_DRM_SIMPLEDRM in ar0x-lts.config).
# -----------------------------------------------------------------------------
MODULES=()
BINARIES=()
FILES=()

HOOKS=(base udev microcode plymouth autodetect modconf kms keyboard keymap consolefont block filesystems fsck)

# CONFIG_RD_ZSTD=y is present in the frozen linux-lts 6.18.59-1 config, so
# zstd is safe and decompresses far faster than xz on a live boot.
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T0 -19)
