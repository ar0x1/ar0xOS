# /etc/sysctl.d/50-ar0x-security.conf — ar0x v0.1 BALANCED hardening.
# Audience = DEVELOPERS, so every knob that breaks debugging, Flatpak or
# rootless containers is deliberately NOT set to its paranoid value.
# ⚠️ NEVER run `sysctl --system` inside a chroot — sysctls are HOST-kernel
#    globals; doing so would silently reconfigure the build machine.

# --- Information leaks -------------------------------------------------------
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
# 2 (not 3): still allows userspace profiling with perf for developers.
kernel.perf_event_paranoid = 2
fs.suid_dumpable = 0

# --- Kernel attack surface ---------------------------------------------------
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
vm.unprivileged_userfaultfd = 0
# 1 (not 2): allows gdb/strace on child processes, blocks unrelated ptrace.
kernel.yama.ptrace_scope = 1

# --- Filesystem protections --------------------------------------------------
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# --- ⚠️ USER NAMESPACES: KEPT ENABLED ON PURPOSE -----------------------------
# Arch's linux-lts 6.18.59-1 packaging carries patch 0001 which ADDS this
# sysctl (default 1). Setting 0 would harden the kernel but BREAK Flatpak,
# rootless Podman/Docker/BuildKit, Chromium's non-root renderer sandbox and
# bubblewrap — all core developer tools. ar0x therefore pins it to 1.
# This sysctl exists ONLY because of that Arch patch; on a vanilla kernel the
# line would produce a harmless "cannot stat" notice at boot.
kernel.unprivileged_userns_clone = 1

# --- Deliberately NOT set (paranoid values that break developer workflows) ---
# kernel.unprivileged_userns_clone = 0    # breaks Flatpak / rootless containers
# kernel.perf_event_paranoid = 3         # breaks perf / bpftrace profiling
# kernel.yama.ptrace_scope = 2           # breaks gdb / strace
# kernel.io_uring_disabled = 2           # breaks modern high-perf I/O
# kernel.kexec_load_disabled = 1         # breaks fast-reboot dev workflows
