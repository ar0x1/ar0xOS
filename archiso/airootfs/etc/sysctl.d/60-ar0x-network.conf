# /etc/sysctl.d/60-ar0x-network.conf — IPv4/IPv6 network hardening.
# ⚠️ Host-kernel globals: never apply this inside a build chroot.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
# 0 (not 2): stable IPv6 addresses matter for dev servers / SSH / containers.
# Enable privacy extensions per-host if you carry this laptop on public WiFi.
net.ipv6.conf.all.use_tempaddr = 0
net.ipv6.conf.default.use_tempaddr = 0
