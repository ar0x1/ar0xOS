# /usr/share/sddm/themes/ar0x/theme.conf
# SDDM's ThemeConfig (a QQmlPropertyMap) reliably exposes `background` and
# `defaultBackground`. Everything else is hard-coded in Main.qml from the
# config/versions.env palette; --check asserts the two stay in sync.
# background.png is generated deterministically by tools/gen-desktop-assets.sh.
[General]
background=background.png
