# /home/user/ar0xOS/config/branding/palette.conf
# -----------------------------------------------------------------------------
# MACHINE-READABLE ar0x BRAND CONSTANTS (ADR-015 / ADR-022).
# Shell-sourceable KEY=value only, NO code. Hex values MUST equal the eight
# AR0X_* pins in config/versions.env; tools/configure-branding.sh --check and
# tools/validate-versions.sh enforce that parity.
# -----------------------------------------------------------------------------
AR0X_BRAND_VERSION="1.0"
AR0X_BRAND_NAME="ar0x"
AR0X_BRAND_CODENAME="ar0x root"

# --- Core palette: exact 24-bit hex, always uppercase ------------------------
AR0X_BRAND_VOID="#07090F"       # background / negative space, 60% of a layout
AR0X_BRAND_SURFACE="#11151F"    # panels, cards, elevated surfaces
AR0X_BRAND_CYAN="#00E5FF"       # primary accent, links, focus, logomark frame
AR0X_BRAND_MAGENTA="#FF2E88"    # secondary accent, prompt underscore, alerts+
AR0X_BRAND_LIME="#A8FF60"       # success / active node, use sparingly (<5%)
AR0X_BRAND_TEXT="#D7E0EE"       # primary text on void/surface
AR0X_BRAND_MUTED="#6B7891"      # secondary text, labels, disabled controls
AR0X_BRAND_ALERT="#FF5C57"      # errors / destructive actions ONLY

# --- Typography --------------------------------------------------------------
AR0X_BRAND_FONT_DISPLAY="Inter"
AR0X_BRAND_FONT_MONO="JetBrains Mono Nerd"
AR0X_BRAND_WORDMARK_WEIGHT="700"
AR0X_BRAND_WORDMARK_TRACKING="-4"

# --- Geometry (assets/logo/*.svg) --------------------------------------------
AR0X_BRAND_LOGO_VIEWBOX="0 0 512 512"
AR0X_BRAND_WORDMARK_VIEWBOX="0 0 1024 256"
AR0X_BRAND_MARK_MIN_PX="24"
AR0X_BRAND_WORDMARK_MIN_PX="120"
AR0X_BRAND_CLEARSPACE_RATIO="1/8"
AR0X_BRAND_OCTAGON_STROKE="28"
AR0X_BRAND_GLYPH_STROKE="40"

# --- Licensing ---------------------------------------------------------------
AR0X_BRAND_LICENSE="CC-BY-SA-4.0"
AR0X_BRAND_LICENSE_FILE="assets/logo/LICENSE"
