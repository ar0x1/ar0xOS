<?xml version="1.0" encoding="UTF-8"?>
<!-- /home/user/ar0xOS/assets/icons/ar0x-logo.svg
     Icon-theme variant of the master mark. Installed at
     /usr/share/icons/hicolor/scalable/apps/ar0x-logo.svg so that os-release(5)
     LOGO=ar0x-logo resolves for graphical tools (systemd >= 252).
     A void rounded-square plate guarantees contrast on LIGHT icon themes;
     the scalable master stays transparent. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-labelledby="ar0x-icon-title">
  <title id="ar0x-icon-title">ar0x logo icon</title>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#07090F"/>
  <g transform="translate(64,64) scale(0.75)">
    <polygon points="136,24 376,24 488,136 488,376 376,488 136,488 24,376 24,136"
             fill="none" stroke="#00E5FF" stroke-width="28" stroke-linejoin="miter"/>
    <polyline points="150,170 238,256 150,342"
              fill="none" stroke="#00E5FF" stroke-width="40"
              stroke-linecap="butt" stroke-linejoin="miter"/>
    <line x1="272" y1="342" x2="362" y2="342"
          stroke="#FF2E88" stroke-width="40" stroke-linecap="butt"/>
    <rect x="322" y="170" width="48" height="48" fill="#A8FF60"/>
  </g>
</svg>
