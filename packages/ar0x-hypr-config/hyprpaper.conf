# /etc/skel/.config/hypr/hyprpaper.conf
# hyprpaper 0.8.5 uses anonymous `wallpaper { }` blocks (verified against the
# 2026 Hyprland wiki). The old `preload =` / `wallpaper = ,path` syntax is
# legacy. An EMPTY monitor = fallback for every attached output.
# Absolute path is MANDATORY: /etc/skel configs must never reference $HOME.
splash = false
ipc = true

wallpaper {
    monitor =
    path = /usr/share/backgrounds/ar0x/ar0x-neon-grid.png
    fit_mode = cover
}
