# /etc/ar0x/update.conf — ar0x-update configuration (Phase 8)
# -----------------------------------------------------------------------------
# Sourced by /usr/bin/ar0x-update. This is a PLAIN `KEY=value` file, NOT an
# executable script: do not add commands, and do not add `set -euo pipefail`.
# Every value is validated by `ar0x-update --status` before use.
#
# Declared as backup=() in packages/ar0x-update/PKGBUILD, so a pacman upgrade
# will never silently overwrite a local edit (it writes update.conf.pacnew).
# Full tradeoff table: docs/TOOLS_GUIDE.md §4.
# -----------------------------------------------------------------------------

# Repository whose metadata signature MUST be verified before --check.
AR0X_UPDATE_REPO="ar0x"

# Minimum accepted SigLevel for that repository. `Required` is the only safe
# value for a signed custom repo. `Never`, `Optional` or `TrustAll` are refused.
AR0X_UPDATE_SIGLEVEL="Required"

# Privilege backend used by --upgrade. `pkexec` uses the polkit agent
# (polkit-gnome, Phase 6); `sudo` needs a TTY; `none` prints the exact command
# without running it (useful for review / CI).
AR0X_UPDATE_BACKEND="pkexec"

# pacman arguments for --upgrade. NEVER add -Sy alone (partial upgrade),
# --noconfirm, --overwrite '*' or --dbonly here.
AR0X_UPDATE_PACMAN_ARGS="-Syu"

# How many old package tarballs `pacman -Sc` may keep. 0 disables pruning.
# Rollback (--rollback) can only downgrade to a version still in the cache.
AR0X_UPDATE_KEEP_CACHED="3"

# Maximum number of `[ALPM] upgraded` entries shown by --rollback.
AR0X_UPDATE_ROLLBACK_LIMIT="20"

# Require an interactive `yes` before --upgrade even when --yes is passed.
# Set to "no" ONLY for scripted CI on a disposable VM.
AR0X_UPDATE_CONFIRM="yes"

# Timeout (seconds) for the metadata download in --check.
AR0X_UPDATE_SYNC_TIMEOUT="120"

# Extra repos to include in --check output. Empty = all repos in pacman.conf.
AR0X_UPDATE_REPO_FILTER=""
