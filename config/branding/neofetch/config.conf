# /etc/skel/.config/neofetch/config.conf  (CANONICAL: config/branding/neofetch/)
# ---------------------------------------------------------------------------
# ⚠️ NOT SHIPPED AS A PACKAGE: neofetch was REMOVED from Arch [extra] (upstream
#    dylanaraps/neofetch is archived since 2021) and is AUR-only. ar0x does not
#    pull AUR packages into the ISO (RISK-010). This config IS shipped so that
#    `yay -S neofetch` or Phase 8's ar0x-welcome "extras" picks it up.
#    The supported in-ISO fetch tool is fastfetch; screenfetch IS in [extra].
#
# neofetch's own default config comment confirms the two keys below:
#   image_backend "ascii"  +  image_source "/path/to/ascii" (Flag: --source).
# This file is SOURCED by neofetch: no shebang, no `set -euo pipefail`, no code.
# ---------------------------------------------------------------------------
image_backend="ascii"
image_source="/usr/share/ar0x/branding/ar0x-ascii.txt"
ascii_bold="on"
# Terminal-nearest approximations of the exact brand hex (docs/BRANDING_GUIDE.md).
ascii_colors=(6 5 2 4)
gap=3
colors=(6 5 2 4 8 7)
bold="on"
underline="on"
separator=" ── "
block_width=3
block_height=1
