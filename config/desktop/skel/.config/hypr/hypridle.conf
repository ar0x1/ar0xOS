# /etc/skel/.config/hypr/hypridle.conf
# hypridle 0.1.8. ⚠️ Hyprland 0.57 removed legacy `hyprctl dispatch dpms off`.
# DPMS now uses the Lua dispatcher: hl.dsp.dpms({ action = "disable"|"enable" }).
# Tradeoff: suspend is DISABLED on the LIVE ISO — a suspended VM is a support
# nightmare. The installed system may enable the 30-min listener manually.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}
