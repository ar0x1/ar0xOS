# /etc/skel/.config/gtk-4.0/settings.ini
# GTK4 ignores gtk-theme-name. Only icon/font/cursor/dark-preference keys here
# are read; ALL colours come from gtk.css in this directory.
# ⚠️ libadwaita apps hard-code Adwaita. They honour GTK_THEME (set in
#    lua/env.lua) and @define-color overrides in gtk.css — but never a
#    gtk-theme-name. This is an upstream design decision, not an ar0x bug.
[Settings]
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Inter 10
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-enable-primary-paste=false
