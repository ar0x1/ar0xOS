# /etc/environment.d/20-ar0x-desktop.conf
# systemd USER manager environment (NOT a shell script — no `export`, no $()).
# Sorted AFTER Phase 5's 10-ar0x-wayland.conf.
# ⚠️ GDK_BACKEND is deliberately absent: forcing it globally breaks GTK apps
#    running under XWayland (Phase 5 decision).
# ⚠️ /etc/environment (the PAM file) is NOT used for Wayland-specific vars.
QT_QPA_PLATFORMTHEME=qt5ct:qt6ct
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
QT_AUTO_SCREEN_SCALE_FACTOR=1
XCURSOR_THEME=ar0x-cursors
XCURSOR_SIZE=24
HYPRCURSOR_SIZE=24
GTK_THEME=Adwaita-dark
XDG_CURRENT_DESKTOP=Hyprland
MOZ_ENABLE_WAYLAND=1
ELECTRON_OZONE_PLATFORM_HINT=auto
