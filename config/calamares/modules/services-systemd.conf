# /etc/calamares/modules/services-systemd.conf — Phase 10
# Service state on the TARGET. The live-ISO preset is
# config/system/systemd/system-preset/50-ar0x.preset (ONE owner per path).
---
services:
    - name: NetworkManager.service
      mandatory: true
    - name: sddm.service
      mandatory: true
    - name: nftables.service
      mandatory: true
    - name: apparmor.service
      mandatory: false
    - name: bluetooth.service
      mandatory: false
    - name: systemd-timesyncd.service
      mandatory: false
targets:
    - name: graphical
      mandatory: true
disable:
    - name: pacman-init.service
      mandatory: false
