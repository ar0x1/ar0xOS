# /etc/calamares/modules/shellprocess-prep.conf — Phase 10
# Instance shellprocess@ar0x-prep, runs INSIDE the target (dontChroot: false).
# Removes the archiso live-initramfs drop-in and build-stamp pacman hook BEFORE
# initcpiocfg + initcpio rebuild the target initramfs.
---
dontChroot: false
timeout: 120
script:
    - "/usr/bin/rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    - "/usr/bin/rm -f /etc/pacman.d/hooks/90-ar0x-build-stamp.hook"
    - "/usr/bin/rm -f /etc/hostname"
i18n:
    name: "Remove live-ISO build artifacts"
