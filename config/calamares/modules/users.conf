# /etc/calamares/modules/users.conf — Phase 10
# The LIVE user `ar0x` has an EMPTY password (RISK-033); it is removed by
# `removeuser` BEFORE this module creates the real account.
---
defaultGroups:
    - wheel
    - audio
    - video
    - render
    - input
    - storage
    - users
sudoersGroup: wheel
userShell: /usr/bin/zsh
setRootPassword: true
doAutologin: false
# No passwordless sudo on the installed system (RISK-013 guard in ar0x-firstboot).
passwordRequirements:
    minLength: 8
    maxLength: 128
    requireUppercase: false
    requireLowercase: false
    requireDigit: false
    requireSpecial: false
    libpwquality: false
