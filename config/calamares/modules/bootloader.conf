# /etc/calamares/modules/bootloader.conf — Phase 10
# GRUB for UEFI + BIOS. Secure Boot is OPTIONAL in v0.1 and MOK enrollment is
# MANUAL (RISK-007); never pretend to enrol a key automatically.
---
efiBootLoader: grub
installEFIFallback: true
secureBoot: false
grubInstall: grub-install
grubMkconfig: grub-mkconfig
bootloaderEntryName: ar0x
kernel: linux-lts
