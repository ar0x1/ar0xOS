# /etc/calamares/modules/shellprocess-finish.conf — Phase 10
# Instance shellprocess@ar0x-finish, LAST job before umount.
# Runs INSIDE the target; the helper is shipped by this phase at
# /usr/lib/ar0x/ar0x-installer-finish in the airootfs (so unpackfs copies it).
#
# It (1) writes the systemd first-boot sentinel `uninitialized` to
# /etc/machine-id, (2) arms ar0x-firstboot.service with an offline-safe symlink,
# (3) removes any surviving NOPASSWD sudoers rule (RISK-013), (4) removes the
# live autologin, (5) drops the ar0x-live sysusers drop-in.
---
dontChroot: false
timeout: 180
script:
    - "/usr/lib/ar0x/ar0x-installer-finish"
i18n:
    name: "Arm ar0x first boot"
