# /etc/calamares/modules/machineid.conf — Phase 10
# Calamares writes a real machine-id here, but systemd's ConditionFirstBoot=yes
# needs the FIRST-BOOT sentinel. shellprocess@ar0x-finish deliberately writes
# `uninitialized` afterwards; systemd replaces it with a real id at first boot
# and ar0x-firstboot.service then runs exactly once. See ADR-026.
