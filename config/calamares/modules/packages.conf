# /etc/calamares/modules/packages.conf — Phase 10
# Applies the packagechooser@ar0x-packages selection + removes live-only bits.
# ⚠️ NO `pacman -Sy` / `-Syu` here: the ISO install is OFFLINE and ar0x-update
# owns upgrades on the installed system (never a bare database refresh).
---
backend: pacman
skip_if_no_internet: true
update_db: false
update_system: false
needed_only: true
operations:
  - remove:
      - calamares
