# /etc/calamares/modules/ar0x-packages.conf — Phase 10
# Instance: packagechooser@ar0x-packages. The `packages` job module (exec
# phase) applies the selected list with `backend: pacman`.
#
# ⚠️ RISK-010: OFFICIAL [core]/[extra] packages ONLY. No AUR, no *-git,
# no *-bin, no `code`, no multilib steam. ar0x_installer.py asserts every name
# against config/packages.x86_64 and config/tools/extra-groups.conf.
---
mode: required
method: packages
labels:
    step: "ar0x software"
items:
    - id: minimal
      name: "Minimal"
      description: "Hyprland/Wayland base, zsh, NetworkManager. No extra developer tooling. Smallest install."
      packages: []
    - id: standard
      name: "Standard (recommended)"
      description: "Minimal plus git, neovim, kitty, wofi, waybar and the ar0x CLI tools."
      packages:
        - git
        - neovim
        - kitty
        - wofi
        - waybar
        - fastfetch
    - id: full
      name: "Full developer"
      description: "Standard plus base-devel, python, jq and screenfetch."
      packages:
        - git
        - neovim
        - kitty
        - wofi
        - waybar
        - fastfetch
        - base-devel
        - python
        - jq
        - screenfetch
