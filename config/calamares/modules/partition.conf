# /etc/calamares/modules/partition.conf — Phase 10
# ⚠️ RISK-004 (CRITICAL, destructive, irreversible): NEVER auto-select a disk.
# With NO initial choice set, the user must look at the device list
# and choose Erase / Manual explicitly. docs/INSTALLER_FLOW.md §2 additionally
# requires `lsblk -o NAME,SIZE,MODEL,TRAN` and typing the target device name.
---
# Never pre-select a device when more than one disk is present.
initialPartitioningChoice: none
allowManualPartitioning: true

# Default (Erase disk) layout: GPT for UEFI, MBR for BIOS.
defaultFileSystemType: ext4
availableFileSystemTypes: [ext4, btrfs]
efiSystemPartitionSize: 512M
efiSystemPartitionName: AR0X_EFI
biosBootPartitionSize: 1M

# btrfs offered with the four ar0x subvolumes (PROJECT_PLAN.md §2.5).
partitionLayout:
    - name: root
      type: ext4
      mountPoint: /

# Encryption is an OPT-IN checkbox (manual), never enabled by default.
allowLuks: true
luksDefault: false

# A 12 GiB minimum avoids silently filling a tiny USB stick.
requiredStorage: 12
swapChoices: [none, file, partition]
swapPartitionSize: 2048M
