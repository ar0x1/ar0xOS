# /home/user/ar0xOS/config/calamares/settings.conf
# -----------------------------------------------------------------------------
# PHASE 10 — CANONICAL Calamares 3.4.3 main configuration (YAML 1.2).
# Installed at /etc/calamares/settings.conf by tools/bootstrap.sh (config/
# calamares -> <staged profile>/airootfs/etc/calamares). That is the ONE owner
# of this path; there is deliberately NO duplicate in archiso/airootfs (ADR-024).
#
# Sequence is the real 3-phase Calamares 3.4 show/exec/show contract. The
# PROJECT_PLAN.md §8.3 logical order
#   welcome -> locale -> keyboard -> partition -> users -> package-select
#   -> bootloader -> unpackfs -> initramfs -> grubcfg -> removeuser -> finished
# maps to it as follows (ADR-026):
#   * "package-select" = instance packagechooser@ar0x-packages (view) plus the
#     `packages` job module in exec, which applies the chosen group list.
#   * "initramfs" = Arch-native initcpiocfg + initcpio (mkinitcpio), NOT the
#     Debian-style initramfs-tools modules.
#   * bootloader/grubcfg MUST run AFTER unpackfs (they write to the TARGET).
#   * mount / machineid / fstab / localecfg / displaymanager / networkcfg /
#     hwclock / services-systemd / umount are required Calamares job modules.
#   * "finished" = final show phase, offers reboot.
#
# Modules WITHOUT a config/calamares/modules/<name>.conf use the upstream
# defaults shipped in /usr/share/calamares/modules/ (enumerated by
# tools/lib/ar0x_installer.py::UPSTREAM_DEFAULT_MODULES).
# -----------------------------------------------------------------------------
---
modules-search: [ local ]

instances:
- id:       ar0x-packages
  module:   packagechooser
  config:   ar0x-packages.conf

- id:       ar0x-prep
  module:   shellprocess
  config:   shellprocess-prep.conf

- id:       ar0x-finish
  module:   shellprocess
  config:   shellprocess-finish.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - packagechooser@ar0x-packages
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - packages
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - shellprocess@ar0x-prep
  - initcpiocfg
  - initcpio
  - removeuser
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - bootloader
  - shellprocess@ar0x-finish
  - umount
- show:
  - finished

# Branding lives in /etc/calamares/branding/ar0x/ (takes precedence over
# /usr/share/calamares/branding). Delivered by the same config/ overlay.
branding: ar0x

# ⚠️ RISK-004: ALWAYS prompt at the point of no return (partitioning).
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
