# /home/user/ar0xOS/config/repo/repo-options.conf
# -----------------------------------------------------------------------------
# PHASE 9 — CANONICAL repository policy. DATA FILE, not an executable script:
# plain KEY="value" lines only, SOURCED by tools/setup-repo.sh. Do NOT add a
# shebang or `set -euo pipefail` (strict mode would leak into the parent).
#
# Every option has a documented tradeoff in docs/REPO_GUIDE.md §4.
# -----------------------------------------------------------------------------

# Repository identity. Must match [ar0x] in config/pacman.conf.installed and
# config/repo/pacman.conf.ar0x-entry; tools/validate-versions.sh asserts it.
AR0X_REPO_NAME="ar0x"
AR0X_REPO_ARCH="x86_64"

# Database file names. `repo-add` creates BOTH ar0x.db.tar.zst and
# ar0x.files.tar.zst plus their detached .sig files (repo-add -s).
AR0X_REPO_DB="ar0x.db.tar.zst"
AR0X_REPO_FILES_DB="ar0x.files.tar.zst"

# ⚠️ SECURITY CONTRACT (§9): NEVER set Optional / Never / TrustAll here.
# `Required` requires valid signatures on BOTH packages and the database, and
# inherits TrustedOnly from the pacman.conf [options] default.
AR0X_REPO_SIGLEVEL="Required"

# Sign every .pkg.tar.zst individually as well as the database. `repo-add`
# embeds package .sig files in the db when --include-sigs is used.
AR0X_REPO_SIGN_PACKAGES="yes"
AR0X_REPO_INCLUDE_SIGS="yes"

# `repo-add -v` verifies the EXISTING db signature before rewriting it.
AR0X_REPO_VERIFY_EXISTING="yes"

# `repo-add -R` removes stale tarballs from disk. 0 = keep (safer: permits
# rollback via ar0x-update --rollback). 1 = prune (smaller mirror, no rollback).
AR0X_REPO_REMOVE_OLD="0"

# How many previous package versions to keep in the publish bundle.
AR0X_REPO_KEEP_OLD="3"

# Default remote. RESERVED endpoint; Phase 12 must point DNS + upload.
# NOTE: \$arch is ESCAPED on purpose: this file is SOURCED by bash under
# `set -u`, so a bare $arch would abort with "unbound variable". The Python
# validators normalise \$ back to $ before comparing to pacman.conf.
AR0X_REPO_SERVER="https://repo.ar0x.dev/\$arch"

# The public endpoint shipped to users. The private key stays OFFLINE.
AR0X_REPO_PUBLIC_KEY="ar0x-public-key.asc"
AR0X_REPO_KEY_FINGERPRINT_FILE="config/repo/RELEASE_KEY_FINGERPRINT"

# Build container. `makepkg` refuses root, hence a non-root builder account.
AR0X_REPO_CI_IMAGE="archlinux:base-devel"
AR0X_REPO_CI_BUILDER="builder"
