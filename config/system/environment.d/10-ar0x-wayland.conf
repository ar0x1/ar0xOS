# /etc/systemd/user-environment-generators-style env for systemd user sessions.
# systemd 262 reads /etc/environment.d/*.conf for the user manager environment.
# ⚠️ GDK_BACKEND is deliberately NOT forced: setting it globally breaks GTK
#    apps running under XWayland. Hyprland (Phase 6) sets session variables.
XDG_SESSION_TYPE=wayland
MOZ_ENABLE_WAYLAND=1
QT_QPA_PLATFORM=wayland;xcb
ELECTRON_OZONE_PLATFORM_HINT=auto
SDL_VIDEODRIVER=wayland
_JAVA_AWT_WM_NONREPARENTING=1
