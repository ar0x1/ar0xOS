# /etc/sysusers.d/ar0x-live.conf — systemd 262 sysusers directives.
# The account itself is declared in /etc/passwd (archiso copies /etc/skel into
# its home for UIDs 1000-59999); these `m` lines add group membership at boot.
# Groups wheel/audio/video/render/input/storage are provided by the `filesystem`
# package. `m` = "add existing user to group" (systemd >= 256).
m ar0x wheel
m ar0x audio
m ar0x video
m ar0x render
m ar0x input
m ar0x storage
m ar0x users
