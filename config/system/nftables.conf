#!/usr/bin/nft -f
# /etc/nftables.conf — ar0x v0.1 default firewall (inet family: IPv4 + IPv6).
# ⚠️ Validate with `nft -c -f /etc/nftables.conf` BEFORE applying.
# ⚠️ NEVER run `nft -f` inside a chroot: nftables talks to the HOST kernel.
table inet ar0x {
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept comment "loopback"
        ct state established,related accept comment "reply traffic"
        ct state invalid drop

        # DHCPv4/v6 client replies (broadcast packets are not always tracked).
        udp sport 67 udp dport 68 accept comment "DHCPv4 client"
        udp dport 546 ip6 saddr fe80::/10 accept comment "DHCPv6 client"

        # ICMP/v6 essentials: PMTUD, NDP, diagnostics.
        icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept
        icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, nd-router-solicit } accept

        # Local service discovery (uncomment for mDNS/LLMNR on LANs).
        # udp dport { 5353, 5355 } accept comment "mDNS / LLMNR"

        # SSH is DENIED by default. Openssh is installed for OUTBOUND use.
        # Uncomment to accept inbound SSH with basic brute-force rate limiting:
        # tcp dport 22 ct state new limit rate 10/minute burst 5 packets accept

        counter comment "count of dropped inbound packets"
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        # Containers/VMs are a v0.2 feature; no forwarding in v0.1.
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
