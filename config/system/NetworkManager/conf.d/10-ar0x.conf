# /etc/NetworkManager/conf.d/10-ar0x.conf — ar0x v0.1
# ADR: NetworkManager (NOT systemd-networkd). systemd-networkd is explicitly
# DISABLED in config/system/systemd/system-preset/50-ar0x.preset to avoid two
# DHCP clients fighting over the same link.
[main]
plugins=keyfile
# Use NM's built-in DHCP client (no dhclient/ dhcpcd dependency).
dhcp=internal
# Do not phone home for a captive-portal probe: privacy-first default.
# Set enabled=true + a uri if you need captive portal detection on laptops.
[connectivity]
enabled=false

[device]
# Randomise the MAC address while scanning for WiFi networks.
wifi.scan-rand-mac-address=yes

[keyfile]
# Keep WiFi passwords in /etc/NetworkManager/system-connections/ (mode 0600).
unmanaged-devices=none
