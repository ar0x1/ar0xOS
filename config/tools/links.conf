# /home/user/ar0xOS/config/tools/links.conf
# -----------------------------------------------------------------------------
# PHASE 8 — canonical hyperlink table for ar0x-welcome.
# Installed by the ar0x-welcome PKGBUILD as:
#   /usr/share/ar0x/welcome/links.conf
#
# FORMAT: one link per line, three pipe-separated fields:
#   KEY|Label shown in the GTK4 button|https://URL
# Lines beginning with '#' and blank lines are ignored. Keys MUST match the
# AR0X_URL_<KEY> pins in config/versions.env; tools/configure-tools.sh --check
# and tools/validate-versions.sh assert the URL parity.
#
# WHY A FILE AND NOT HARDCODED PYTHON: the endpoints are release-engineering
# data, not UI code. Phase 12 can repoint a link by editing ONE file here and
# regenerating the mirror, without touching ar0x-welcome.py.
#
# ⚠️ RISK-050: these are RESERVED endpoints. /tree/main/docs resolves only
#    after the PR is merged. Verify all five with `curl -IL` in Phase 12.
# -----------------------------------------------------------------------------
DOCS|Documentation|https://github.com/ar0x1/ar0xOS/tree/main/docs
ISSUES|Report an issue|https://github.com/ar0x1/ar0xOS/issues
COMMUNITY|Community discussions|https://github.com/ar0x1/ar0xOS/discussions
SOURCE|Source code|https://github.com/ar0x1/ar0xOS
UPSTREAM|Arch Linux Wiki|https://wiki.archlinux.org/
